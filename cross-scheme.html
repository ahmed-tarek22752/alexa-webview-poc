<!doctype html>
<html>
<body>
<h1>Cross-Scheme PoC</h1>

<p id="status">Loaded</p>

<button onclick="testMailto()">Test mailto</button>
<button onclick="testSms()">Test sms</button>

<script>
function testMailto() {
    document.getElementById("status").textContent =
        "Attempting mailto navigation...";
    location.href = "mailto:test@example.com";
}

function testSms() {
    document.getElementById("status").textContent =
        "Attempting sms navigation...";
    location.href = "sms:1234567890";
}
</script>

</body>
</html>
